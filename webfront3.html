<!DOCTYPE html>
<html>
<head>
    <title>Making a Difference</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 3 columns */

            width: 1000px;
            margin: auto;
        }

        .box {
						text-align: center;
            /* background-color: lightblue; */
            border: 2px solid rgb(36, 208, 71);
						box-shadow: 5px 5px 15px 0px rgba(0, 0, 0, 0.20);
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
						padding: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Making a Difference</h2>

<div class="container">

    <div class="box">Recently i start to learn about web development</div>
    <div class="box">My college name is Seacom Engineering College</div>
     <div class="box">My college town is Howrah</div>

</div>

</body>
</html>
